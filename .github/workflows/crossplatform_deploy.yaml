name: Build Cross-Platform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Windows
        run: flutter build windows --release
      
      - name: Install MSIX tool
        run: dart pub global activate msix
      
      - name: Create MSIX
        run: dart run msix:create --install-certificate false
      
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          # Upload only the MSIX file, not the whole release folder
          path: build\windows\runner\Release\*.msix

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build macOS
        run: flutter build macos --release
      
      - name: Create DMG
        run: |
          # Automatically find the generated .app file regardless of its snake_case name
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          
          # Use the dynamically found path to create the DMG
          hdiutil create -volname "RonCafeAppManager" -srcfolder "$APP_PATH" -ov -format UDZO RonCafeAppManager.dmg
      
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: RonCafeAppManager.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libfuse2
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Linux
        run: flutter build linux --release
      
      - name: Create AppImage
        run: |
          # 1. Download AppImage tool
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          # 2. Create the required AppDir structure
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          
          # 3. Create the AppRun script
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          cd "$(dirname "$0")"/usr/bin
          # NOTE: Update 'ron_cafe_app_manager' if your executable name is different
          ./ron_cafe_app_manager 
          EOF
          chmod +x AppDir/AppRun
          
          # 4. Create the .desktop file
          cat << 'EOF' > AppDir/roncafe.desktop
          [Desktop Entry]
          Type=Application
          Name=Ron Cafe App Manager
          Exec=AppRun
          Icon=icon
          Categories=Utility;
          EOF
          
          # 5. Create a dummy icon (AppImage tool requires an icon to compile)
          touch AppDir/icon.png
          
          # 6. Package into AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir RonCafeAppManager.AppImage
      
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: RonCafeAppManager.AppImage